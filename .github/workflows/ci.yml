name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  bash-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check bash syntax
        run: |
          set -euo pipefail
          # Syntax-check this repo's own shell scripts (skip third-party submodules under
          # terminal-tools/zsh/plugins) using `bash -n`, which parses without executing.
          status=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "OK   $script"
            else
              echo "FAIL $script"
              status=1
            fi
          done < <(
            find . \
              -path ./.git -prune -o \
              -path ./terminal-tools/zsh/plugins -prune -o \
              -name '*.sh' -print | sort
          )
          exit "$status"
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r script; do
            if shellcheck -x "$script"; then
              echo "OK   $script"
            else
              echo "FAIL $script"
              status=1
            fi
          done < <(
            find . \
              -path ./.git -prune -o \
              -path ./terminal-tools/zsh/plugins -prune -o \
              -name '*.sh' -print | sort
          )
          exit "$status"
