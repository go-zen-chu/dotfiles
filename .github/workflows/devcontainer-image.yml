name: Devcontainer image

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".devcontainer/**"
      - "install.sh"
      - "scripts/**"
      - "os-linux/**"
      - "terminal-tools/**"
      - "apm/**"
      - ".github/workflows/devcontainer-image.yml"
  push:
    branches:
      - master
    paths:
      - ".devcontainer/**"
      - "install.sh"
      - "scripts/**"
      - "os-linux/**"
      - "terminal-tools/**"
      - "apm/**"
      - ".github/workflows/devcontainer-image.yml"
  # refresh tools (Homebrew installs the latest versions) weekly
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/go-zen-chu/dotfiles-devcontainer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # the repository is copied into the image
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Check installed tools
        run: |
          docker run --rm "${IMAGE}:latest-${{ matrix.arch }}" zsh -ic '
            set -e
            for cmd in git gh direnv uv go node pnpm atuin gitleaks claude apm fzf jq yq bat starship \
                       kubectl kustomize terraform shellcheck golangci-lint gopls vim zsh; do
              command -v "$cmd"
            done
            echo "login shell: $(getent passwd "$(whoami)" | cut -d: -f7)"
          '
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE}:latest-${{ matrix.arch }}"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${GITHUB_SHA::7}" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
