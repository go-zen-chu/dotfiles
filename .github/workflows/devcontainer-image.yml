name: Devcontainer image

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".devcontainer/**"
      - "install.sh"
      - "Brewfile"
      - ".chezmoiroot"
      - "home/**"
      - "scripts/**"
      - "os-linux/**"
      - "terminal-tools/**"
      - "apm/**"
      - ".github/workflows/devcontainer-image.yml"
  push:
    branches:
      - master
    paths:
      - ".devcontainer/**"
      - "install.sh"
      - "Brewfile"
      - ".chezmoiroot"
      - "home/**"
      - "scripts/**"
      - "os-linux/**"
      - "terminal-tools/**"
      - "apm/**"
      - ".github/workflows/devcontainer-image.yml"
  # refresh tools (Homebrew installs the latest versions) weekly
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# cancel the previous PR build when a new commit is pushed (builds on master are kept for publishing)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/go-zen-chu/dotfiles-devcontainer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          # the repository is copied into the image
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Check installed tools
        run: |
          docker run --rm "${IMAGE}:latest-${{ matrix.arch }}" zsh -ic '
            set -e
            for cmd in git gh direnv uv go node pnpm atuin gitleaks claude apm fzf jq yq bat starship \
                       kubectl kustomize tofu shellcheck golangci-lint gopls vim zsh; do
              command -v "$cmd"
            done
            echo "login shell: $(getent passwd "$(whoami)" | cut -d: -f7)"
          '
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE}:latest-${{ matrix.arch }}"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${GITHUB_SHA::7}" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
