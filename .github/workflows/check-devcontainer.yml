name: Check devcontainer

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".devcontainer/**"
      - "install.sh"
      - "scripts/**"
      - "os-linux/**"
      - ".github/workflows/check-devcontainer.yml"

jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and start devcontainer (runs install.sh via postCreateCommand)
        run: npx -y @devcontainers/cli up --workspace-folder .
        env:
          GIT_EMAIL: "actions@github.com"
      - name: Check installed tools
        run: |
          npx -y @devcontainers/cli exec --workspace-folder . zsh -ic '
            set -e
            for cmd in git gh direnv uv go node pnpm atuin gitleaks claude fzf jq starship kubectl vim zsh; do
              command -v "$cmd"
            done
            getent passwd "$(whoami)" | cut -d: -f7
          '
